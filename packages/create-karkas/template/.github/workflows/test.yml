name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Nub
        uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install: true
          cache: true

      - name: Config mise
        run: mise settings experimental=true

      - name: Install dependencies
        run: nub ci

      - name: Run Fallow audit
        uses: fallow-rs/fallow@fccff887da0d83db1711379e0a3696dfc2460fdd # v3.33.1
        with:
          version: 3.33.1
          command: audit
          config: .config/fallow.toml
          format: json
          fail-on-issues: true
          comment: true
          annotations: true
          artifacts-dir: .var/fallow

      - name: Install Playwright browsers
        run: nub exec playwright install --with-deps chromium

      - name: Run CI checks
        run: mise run ci
        env:
          CI: true

      - name: Upload coverage reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: coverage-reports
          path: .var/coverage/
          retention-days: 30

      - name: Generate coverage summary
        if: success()
        run: |
          if [ -f .var/coverage/coverage-summary.json ]; then
            echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            jq --arg cwd "$PWD/" 'walk(if type == "string" then gsub($cwd; "") else . end)' .var/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
