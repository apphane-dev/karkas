entry = ["apps/demo/scripts/**/*.ts", "packages/**/*.ts"]
# `@typescript/native`: TypeScript 7 compiler, not imported by source.
# `idb-keyval`: optional dependency of @reatom/core. The Storybook/Vite optimizer
# eagerly analyzes its dynamic import, so the package must remain resolvable.
# `storybook`: imported by the kahraman actor harness but never runs in production.
ignoreDependencies = ["@typescript/native", "idb-keyval", "storybook"]

# Park UI and generated assets are committed vendor/generated code.
ignorePatterns = [
	"apps/demo/public/mockServiceWorker.js",
	"apps/demo/scripts/steiger/**",
	"apps/demo/src/paraglide/**",
	"apps/demo/src/shared/components/ui/**",
	"apps/demo/src/shared/styled-system/**",
	"apps/demo/theme/recipes/**",
	"packages/create-karkas/template/**",
	"site/**",
]

[duplicates]
ignore = ["apps/demo/messages/**", "apps/demo/src/**/*.stories.tsx"]
ignoreImports = true
