[tasks.dev]
description = "Start demo Vite dev server"
usage = '''
flag "-p --port <port>" help="Port for the Vite dev server"
arg "[rest]" help="Additional arguments to pass to Vite"
'''
run = "mise run //apps/demo:dev -- ${usage_port:+--port ${usage_port}} ${usage_rest}"

[tasks.storybook]
description = "Start demo Storybook"
alias = "sb"
usage = '''
flag "-p --port <port>" help="Port for Storybook"
'''
run = "mise run //apps/demo:storybook -- ${usage_port:+--port ${usage_port}}"

[tasks."dev:site"]
description = "Start landing-site development server"
run = "mise run //site:dev"

[tasks.preview]
description = "Preview demo production build"
run = "mise run //apps/demo:preview"

[tasks.clean]
description = "Clean monorepo build artifacts and caches"
run = ["rm -rf .var", "rm -rf apps/demo/node_modules/.vite site/node_modules/.vite"]
