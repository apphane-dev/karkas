min_version = "2026.4.18" # required for [deps] (renamed from [prepare])

[tools]
"npm:@nubjs/nub" = "0.7.5"
node = "lts"
jq = "latest"
vp = "latest"
hk = "latest"
uv = "0.12"

[task_config]
dir = "{{ config_root }}"

[env]
'_'.path = { path = "{{ config_root }}/node_modules/.bin" }
STORYBOOK_ENABLE_CRASH_REPORTS = 1
HK_PKL_BACKEND = "pklr"
HK_MISE = 1

[deps.nub]
auto = true
sources = ["pnpm-lock.yaml", "package.json", "apps/*/package.json", "packages/*/package.json", "site/package.json"]
outputs = ["node_modules/.modules.yaml"]
run = "nub install"

[shell_alias]
mr = "mise run"

# Agent skills materialized by APM (see apm.yml); output is gitignored.
[deps.skills]
auto = true
sources = ["apm.yml"]
outputs = [".agents/skills"]
# Pinned to microsoft/apm main (v0.33.0-dev): skill-bundle installs need
# an unreleased fix (released 0.4.3 rejects SKILL_BUNDLE packages).
run = "uvx --from 'git+https://github.com/microsoft/apm@18c4c43c924ceae890fe0f2038806690e5b2d6c8' apm install --only apm"
