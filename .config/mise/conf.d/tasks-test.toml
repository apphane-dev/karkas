[tasks.test]
description = "Run demo tests in watch mode"
alias = "t"
run = "mise run //apps/demo:test"

[tasks."test:run"]
description = "Run demo tests once"
alias = "tr"
run = "mise run //apps/demo:test:run"

[tasks."test:coverage"]
description = "Run demo tests with coverage"
alias = "tcov"
run = "mise run //apps/demo:test:coverage"

[tasks."test:ci"]
description = "Run all monorepo tests for CI"
run = ["mise run //apps/demo:test:coverage", "mise run //packages/create-karkas:test"]
