[tasks."prepare:git-hooks"]
description = "Install hk Git hooks"
run = "hk install --mise"
sources = [".config/hk.pkl"]

[tasks."prepare:local-overrides"]
description = "Set up local overrides file if missing"
run = '''
if [ ! -f mise.local.toml ]; then
  sed '/^##/d' .config/mise/conf.d/local.toml.example > mise.local.toml
fi
'''

[tasks.prepare]
description = "Prepare all monorepo projects"
run = [
	"mise run --no-deps //apps/demo:prepare",
	"mise run --no-deps //site:prepare",
	"mise run --no-deps prepare:git-hooks",
	"mise run --no-deps prepare:local-overrides",
]
