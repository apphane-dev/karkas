[vars]
build_dir = "{{ config_root }}/.var/dist"
webapp_out_dir = "{{ vars.build_dir }}/webapp"
storybook_out_dir = "{{ vars.build_dir }}/storybook"
site_out_dir = "{{ vars.build_dir }}/site"
cf_pages_out_dir = "{{ vars.build_dir }}/cf-pages"

[env]
CF_PAGES_OUT_DIR = "{{ vars.cf_pages_out_dir }}"

[tasks."build:webapp"]
description = "Build demo application"
run = "mise run //apps/demo:build:webapp"
sources = ["apps/demo/src/**/*.{ts,tsx}", "apps/demo/index.html", "apps/demo/vite.config.ts"]
outputs = ["{{ vars.webapp_out_dir }}/**/*"]

[tasks."build:storybook"]
description = "Build demo Storybook"
run = "mise run //apps/demo:build:storybook"
sources = ["apps/demo/src/**/*.{ts,tsx,stories.tsx}", "apps/demo/.storybook/**/*"]
outputs = ["{{ vars.storybook_out_dir }}/**/*"]

[tasks."build:site"]
description = "Build landing site"
run = "mise run //site:build"
sources = ["site/src/**/*.{astro,ts,css,md}", "site/astro.config.mjs"]
outputs = ["{{ vars.site_out_dir }}/**/*"]

[tasks."build:create-karkas"]
description = "Build the create-karkas CLI"
run = "mise run //packages/create-karkas:build"
sources = [
	"packages/create-karkas/src/**/*.ts",
	"packages/create-karkas/tsup.config.ts",
	"packages/create-karkas/package.json",
]
outputs = ["packages/create-karkas/dist/cli.js"]

[tasks.build]
description = "Build all monorepo projects"
run = [
	{ task = "build:webapp" },
	{ task = "build:storybook" },
	{ task = "build:site" },
	{ task = "build:create-karkas" },
]

[tasks."build:cf-pages"]
description = "Prepare deployment artifacts for Cloudflare Pages"
env = { VITE_ENABLE_MSW = "true", VITE_CONNECT_LOGGER = "true" }
# Astro cleans its output directory, so it must build before the demo and Storybook
# fill their subpaths in the shared artifact.
run = [
	"mise run //apps/demo:prepare:codegen",
	"mise run //site:prepare",
	"mise run //site:build:base {{ vars.cf_pages_out_dir }}",
	"mise run //apps/demo:build:webapp:base {{ vars.cf_pages_out_dir }}/demo /demo/",
	"mise run //apps/demo:build:storybook:base {{ vars.cf_pages_out_dir }}/storybook /storybook/",
]
sources = [
	"apps/demo/src/**/*.{ts,tsx}",
	"apps/demo/index.html",
	"apps/demo/vite.config.ts",
	"apps/demo/.storybook/**/*",
	"site/src/**/*.{astro,ts,css,md}",
	"site/astro.config.mjs",
]
outputs = ["{{ vars.cf_pages_out_dir }}/**/*"]
